# Render Blueprint — Wahm Social (single Node web service)
services:
  - type: web
    name: wahm-social
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: auto
      - key: DATA_DIR
        value: ./data
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: IG_SESSIONID
        sync: false
      - key: IG_CSRFTOKEN
        sync: false
      - key: IG_DS_USER_ID
        sync: false
      - key: IG_MID
        sync: false
      - key: IG_DATR
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: TIKTOK_SESSIONID
        sync: false
      - key: TIKTOK_COOKIE
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PRO_YEARLY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
    # For durable users/watchlist on a paid plan, attach a disk and point DATA_DIR at it:
    # disk:
    #   name: wahm-data
    #   mountPath: /var/data
    #   sizeGB: 1
